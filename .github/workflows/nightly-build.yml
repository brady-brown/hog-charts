name: Nightly Site Build

on:
  schedule:
    - cron: "0 7 * * *"   # 2 AM CT (7 AM UTC)
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Current-season data pipeline ─────────────────────────────────────
      # OVERRIDE_SEASON is not set — each script auto-detects the current season.

      - name: Build predictor artifacts + net ratings
        run: python build_artifacts.py

      - name: Build shot + box parquets
        run: python build_shots_data.py

      - name: Build player stats CSVs
        run: python build_player_stats.py

      - name: Build lineup CSVs
        run: python build_lineups.py

      - name: Build on/off + RAPM CSVs
        run: python build_onoff_rapm.py

      - name: Build site JSON
        run: python build_site.py

      # ── Commit & push → triggers Netlify deploy ──────────────────────────

      - name: Commit updated site/data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: nightly site rebuild [skip ci]"
          # The remote may have advanced since checkout (a manual push or an
          # overlapping run). Rebase onto it and push, retrying a few times so a
          # lost race doesn't fail the whole build.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in 5s…"
            sleep 5
          done
          echo "Failed to push after 3 attempts." >&2
          exit 1
