name: Nightly Site Build

on:
  schedule:
    - cron: "0 7 * * *"   # 2 AM CT (7 AM UTC)
  workflow_dispatch:        # manual trigger from GitHub UI
  # NOTE: no `push` trigger. A full build is ~28 min; firing it on every commit
  # burned the private-repo Actions minutes quota (2,000/mo) and got runs
  # cancelled mid-flight. Nightly + manual keeps us well under the limit.

# Never run two builds at once (they'd both try to push site/data). Let an
# in-progress run finish rather than cancelling it.
concurrency:
  group: nightly-site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap runaway/hung runs (a step occasionally hangs and ran 1h+). Normal
    # build is ~28 min, so 45 leaves headroom while still failing fast.
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Current-season data pipeline ─────────────────────────────────────
      # OVERRIDE_SEASON is not set — each script auto-detects the current season.

      - name: Build predictor artifacts + net ratings
        run: python build_artifacts.py

      - name: Build shot + box parquets
        run: python build_shots_data.py

      - name: Build player stats CSVs
        run: python build_player_stats.py

      - name: Build lineup CSVs
        run: python build_lineups.py

      - name: Build on/off + RAPM CSVs
        run: python -u build_onoff_rapm.py

      - name: Build site JSON
        run: python build_site.py

      - name: Build postseason bracket + leaders
        run: python build_postseason.py

      # ── Commit & push → triggers Cloudflare Pages deploy ─────────────────

      - name: Commit updated site/data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bail early if the build produced no changes.
          git add site/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # site/data is fully regenerated each run, so our freshly-built copy is
          # always the desired final state. Rather than rebase/merge (which would
          # conflict on every regenerated JSON file vs. an overlapping run), we
          # re-point onto the latest remote and lay our files down as one new
          # commit on top. No replay, so nothing can conflict.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main      # newest remote tree; keep our files staged
            git add site/data/
            if git diff --cached --quiet; then
              echo "Remote already up to date — nothing to push."
              exit 0
            fi
            git commit -m "chore: nightly site rebuild [skip ci]"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed (remote moved); resyncing…"
            sleep 3
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
