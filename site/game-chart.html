<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Chart | Hog Charts</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <meta name="theme-color" content="#0E1320">
  <link rel="apple-touch-icon" href="img/logo.png">
  <style>
    .gc-wrap { max-width:640px; margin:0 auto; }
    .gc-pickers { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .gc-pickers .form-group:last-child { grid-column:1 / -1; }
    .gc-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
    .gc-tools .btn { width:auto; margin:0; padding:9px 20px; }
    .gc-status { color:var(--muted); font-size:.92rem; padding:24px 0; }
    .gc-status:empty { display:none; }
    #gc-canvas[hidden] { display:none; }
    #gc-canvas { display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line); }
    @media (max-width:520px) { .gc-pickers { grid-template-columns:1fr; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="img/logo.png" alt="Hog Charts logo">Hog Charts</a>
</nav>

<div class="container">
<div class="gc-wrap">
  <h2>Game Chart</h2>

  <div class="gc-pickers">
    <div class="form-group"><label for="gc-team">Team</label><select id="gc-team" disabled><option>Loading…</option></select></div>
    <div class="form-group"><label for="gc-player">Player</label><select id="gc-player" disabled></select></div>
    <div class="form-group"><label for="gc-game">Game</label><select id="gc-game" disabled></select></div>
  </div>

  <div class="gc-tools">
    <div class="ctl-group">
      <span class="ctl-label">Court</span>
      <div class="seg" id="gc-style">
        <button data-style="dark" class="active">Dark</button>
        <button data-style="wood">Hardwood</button>
      </div>
    </div>
    <button class="btn" id="gc-save" disabled>Download PNG</button>
  </div>

  <div class="gc-status" id="gc-status">Loading…</div>
  <canvas id="gc-canvas" width="1080" height="1350" hidden></canvas>
</div>
</div>

<script src="js/common.js"></script>
<script src="js/court.js"></script>
<script src="js/games.js"></script>
<script src="js/game-graphic.js"></script>
<script>
// Game Chart: one player's one game — identity, box line, and every field-goal
// attempt on the court — drawn onto a 1080×1350 canvas (Instagram portrait) so
// the PNG download is exactly what's on screen.
//
// URL: ?id={playerId}&game={gameId}. No game → his most recent one. Live season
// only: shot coordinates (data/shots/{team}.json) exist for the current season.
//
// Sources: player-stats-all.json (name, team, jersey, position, class),
// data/{season}/games/teams/{tid}.json via Games.teamFile (box line, score),
// data/shots/{slug}.json (shot x/y; packs [gameIdx, x*10, y*10, made, playerIdx]).

const params = new URLSearchParams(location.search);
let SEASON = null;
let ROWS = new Map();        // player id → player-stats-all row (identity)
let TEAMS = [];              // [{tid, t}] sorted by name
let STYLE = "dark";
let CURRENT = null;          // what's drawn: {player, team, game, line, shots}

// ── data ──────────────────────────────────────────────────────────────────
async function teamShots(teamName) {
  return loadJSON(`data/shots/${slugify(teamName)}.json`);
}

// Players who logged a game for this team, newest-season roster order by points.
function teamPlayers(file) {
  const tally = new Map();
  for (const g of file.games) for (const p of g.players) {
    if (p.dnp) continue;
    const t = tally.get(p.id) ?? { id: p.id, n: p.n, pos: p.pos, pts: 0 };
    t.pts += p.pts ?? 0;
    tally.set(p.id, t);
  }
  return [...tally.values()].sort((a, b) => b.pts - a.pts || a.n.localeCompare(b.n));
}

function playerGames(file, playerId) {
  return file.games
    .map((g) => ({ g, line: g.players.find((p) => p.id === playerId && !p.dnp) }))
    .filter((x) => x.line)
    .reverse();                                     // newest first
}

// ── the graphic (drawn by js/game-graphic.js, shared with team-game-chart.html) ──
async function draw() {
  if (!CURRENT) return;
  const now = CURRENT, { player, team, game, line, shots } = now;
  const canvas = document.getElementById("gc-canvas");
  const drawn = await GameGraphic.draw(canvas, {
    image: { src: playerUrl(player.id), fit: "cover" }, fallback: logoUrl(team.tid),
    title: player.n,
    sub: { logo: logoUrl(team.tid), text: team.t },
    chips: [player.jn ? `#${player.jn}` : null, player.pos, player.exp],
    game, line, shots,
  }, STYLE, () => CURRENT === now);
  if (!drawn) return;
  canvas.hidden = false;
  document.getElementById("gc-save").disabled = false;
}

// ── selection flow: team → player → game ──────────────────────────────────
function setStatus(text) { document.getElementById("gc-status").textContent = text; }
function syncUrl() {
  if (CURRENT) history.replaceState(null, "", `?id=${CURRENT.player.id}&game=${CURRENT.game.g}`);
}

async function chooseTeam(tid, wantPlayer = null, wantGame = null) {
  const pSel = document.getElementById("gc-player");
  pSel.disabled = true;
  pSel.innerHTML = "<option>Loading…</option>";
  const file = await Games.teamFile(SEASON, tid);
  if (Number(document.getElementById("gc-team").value) !== tid) return;
  const players = file ? teamPlayers(file) : [];
  if (!players.length) {
    pSel.innerHTML = ""; document.getElementById("gc-game").innerHTML = "";
    CURRENT = null; document.getElementById("gc-canvas").hidden = true;
    setStatus("No games yet.");
    return;
  }
  pSel.innerHTML = players.map((p) => `<option value="${p.id}">${p.n}</option>`).join("");
  pSel.disabled = false;
  pSel.value = players.some((p) => p.id === wantPlayer) ? wantPlayer : players[0].id;
  choosePlayer(file, Number(pSel.value), wantGame);
}

function choosePlayer(file, playerId, wantGame = null) {
  const gSel = document.getElementById("gc-game");
  const games = playerGames(file, playerId);
  gSel.innerHTML = games.map(({ g }) =>
    `<option value="${g.g}">${Games.shortDate(g.d)} · ${Games.opponentLabel(g)}</option>`).join("");
  gSel.disabled = !games.length;
  if (!games.length) return;
  gSel.value = games.some(({ g }) => g.g === wantGame) ? wantGame : games[0].g.g;
  chooseGame(file, playerId, Number(gSel.value));
}

async function chooseGame(file, playerId, gameId) {
  const tid = Number(document.getElementById("gc-team").value);
  const team = TEAMS.find((t) => t.tid === tid) ?? { tid, t: file.t };
  const game = file.games.find((g) => g.g === gameId);
  const line = game.players.find((p) => p.id === playerId);
  const row = ROWS.get(playerId);
  const positions = { G: "Guard", F: "Forward", C: "Center" };     // box scores abbreviate
  const player = row ?? { id: playerId, n: line.n, pos: positions[line.pos] ?? line.pos };

  setStatus("");
  const data = await teamShots(file.t);
  const gi = data?.games?.findIndex((g) => g.id === gameId) ?? -1;
  const pi = data?.players?.indexOf(player.n) ?? -1;
  const shots = gi >= 0 && pi >= 0
    ? shotsXY(data.shots, (g, p) => g === gi && p === pi)
    : { mx: [], my: [], hx: [], hy: [] };
  CURRENT = { player, team, game, line, shots };
  syncUrl();
  draw();
}

function save() {
  if (CURRENT) GameGraphic.save(document.getElementById("gc-canvas"), `${slugify(CURRENT.player.n)}-${CURRENT.game.d}.png`);
}

async function init() {
  const seasons = await loadJSON("data/seasons.json") ?? [];
  SEASON = seasons[0];
  const stats = await loadJSON(`data/${SEASON}/player-stats-all.json`);
  for (const p of stats?.players ?? []) ROWS.set(p.id, p);
  const byTeam = new Map();
  for (const p of ROWS.values()) if (p.tid != null) byTeam.set(p.tid, p.t);
  TEAMS = [...byTeam].map(([tid, t]) => ({ tid, t })).sort((a, b) => a.t.localeCompare(b.t));
  if (!TEAMS.length) { setStatus("No games yet."); return; }

  const wantPlayer = Number(params.get("id")) || null;
  const wantGame = Number(params.get("game")) || null;
  const tSel = document.getElementById("gc-team");
  tSel.innerHTML = `<option value="">—</option>` + TEAMS.map((t) => `<option value="${t.tid}">${t.t}</option>`).join("");
  tSel.disabled = false;

  let pending = { player: wantPlayer, game: wantGame };   // deep link, used by the first team pick only
  tSel.addEventListener("change", () => {
    const tid = Number(tSel.value);
    if (tid) chooseTeam(tid, pending.player, pending.game);
    pending = {};
  });
  document.getElementById("gc-player").addEventListener("change", async (e) => {
    const file = await Games.teamFile(SEASON, Number(tSel.value));
    if (file) choosePlayer(file, Number(e.target.value));
  });
  document.getElementById("gc-game").addEventListener("change", async (e) => {
    const file = await Games.teamFile(SEASON, Number(tSel.value));
    if (file) chooseGame(file, Number(document.getElementById("gc-player").value), Number(e.target.value));
  });
  document.getElementById("gc-style").addEventListener("click", (e) => {
    const style = e.target.dataset?.style;
    if (!style || style === STYLE) return;
    STYLE = style;
    document.querySelectorAll("#gc-style button").forEach((b) => b.classList.toggle("active", b.dataset.style === style));
    draw();
  });
  document.getElementById("gc-save").addEventListener("click", save);

  // Deep link: start on this player's team (stats row first, else whoever's game file names him).
  let startTid = ROWS.get(wantPlayer)?.tid ?? null;
  if (wantPlayer && startTid == null && wantGame) {
    for (const t of TEAMS) {
      const f = await Games.teamFile(SEASON, t.tid);
      if (f?.games.some((g) => g.g === wantGame && g.players.some((p) => p.id === wantPlayer))) { startTid = t.tid; break; }
    }
  }
  if (startTid != null) {
    tSel.value = startTid;
    tSel.dispatchEvent(new Event("change"));      // also refreshes the searchable box's label
  } else {
    pending = {};
  }
  setStatus("");
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
