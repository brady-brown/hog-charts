<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predictor | Hog Charts</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <meta name="theme-color" content="#0E1320">
  <link rel="apple-touch-icon" href="img/logo.png">
  <style>
    /* ── Searchable team picker ─────────────────────────────────────────── */
    .combo { position: relative; }
    .combo-input-wrap { position: relative; display: flex; align-items: center; }
    .combo-input-wrap img {
      position: absolute; left: 11px; width: 22px; height: 22px;
      object-fit: contain; pointer-events: none;
    }
    .combo-input.has-logo { padding-left: 42px; }
    .combo-clear {
      position: absolute; right: 10px; width: 22px; height: 22px; border: none;
      background: none; color: var(--muted); cursor: pointer; font-size: 1rem;
      display: none; line-height: 1;
    }
    .combo-input-wrap.filled .combo-clear { display: block; }
    .combo-clear:hover { color: var(--ink); }
    .combo-list {
      position: absolute; z-index: 50; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
      max-height: 300px; overflow-y: auto; display: none;
      box-shadow: 0 14px 30px rgba(0,0,0,.5);
      -webkit-overflow-scrolling: touch;
    }
    .combo-list.open { display: block; }
    .combo-opt {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      cursor: pointer; font-size: 0.95rem;
    }
    .combo-opt img { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .combo-opt:hover, .combo-opt.active { background: var(--card); }
    .combo-opt .nm { font-weight: 600; }
    .combo-empty { padding: 11px 12px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="img/logo.png" alt="Hog Charts logo">Hog Charts</a>
  <a href="index.html"        data-page="index.html">Home</a>
  <a href="scout-report.html" data-page="scout-report.html">Scout</a>
  <a href="prediction.html"   data-page="prediction.html">Predictor</a>
  <a href="net-ratings.html"  data-page="net-ratings.html">Team Stats</a>
  <a href="player-stats.html" data-page="player-stats.html">Player Stats</a>
  <a href="lineup-stats.html" data-page="lineup-stats.html">Lineups</a>
  <a href="shot-charts.html"  data-page="shot-charts.html">Shot Charts</a>
  <a href="postseason.html"  data-page="postseason.html">Postseason</a>
  <a href="glossary.html"     data-page="glossary.html">Glossary</a>
</nav>

<div class="container">

  <h2>Game Predictor</h2>
  <p class="page-sub" id="page-sub">Loading…</p>

  <!-- ── Inputs ─────────────────────────────────────────────────────────── -->
  <div class="hc-card">
    <div class="form-row">

      <div class="form-group">
        <label for="team1-input">Team 1</label>
        <div class="combo" id="combo1">
          <div class="combo-input-wrap">
            <img id="team1-logo" alt="" style="display:none" onerror="this.style.opacity=0">
            <input type="text" id="team1-input" class="combo-input" placeholder="Search team…" autocomplete="off" disabled>
            <button type="button" class="combo-clear" id="team1-clear" aria-label="Clear">✕</button>
          </div>
          <div class="combo-list" id="team1-list"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="team2-input">Team 2</label>
        <div class="combo" id="combo2">
          <div class="combo-input-wrap">
            <img id="team2-logo" alt="" style="display:none" onerror="this.style.opacity=0">
            <input type="text" id="team2-input" class="combo-input" placeholder="Search team…" autocomplete="off" disabled>
            <button type="button" class="combo-clear" id="team2-clear" aria-label="Clear">✕</button>
          </div>
          <div class="combo-list" id="team2-list"></div>
        </div>
      </div>

      <div class="form-group" style="flex:0 0 auto;min-width:190px">
        <label>Location</label>
        <div class="radio-group">
          <label><input type="radio" name="venue" value="home1" checked>
            <span id="lbl-home1">Team 1 home</span></label>
          <label><input type="radio" name="venue" value="home2">
            <span id="lbl-home2">Team 2 home</span></label>
          <label><input type="radio" name="venue" value="neutral">
            Neutral site</label>
        </div>
      </div>

    </div>
    <button class="btn" id="predict-btn" disabled>Predict game</button>
  </div>

  <!-- ── Results (hidden until first prediction) ────────────────────────── -->
  <div id="results" style="display:none">

    <div class="hc-hero" id="hero"></div>

    <div class="hc-chips" id="chips"></div>

    <div class="hc-card">
      <div class="hc-sec">Matchup factors</div>
      <div id="factors"></div>
    </div>

    <details>
      <summary>How the model built this spread</summary>
      <div class="details-body" id="breakdown"></div>
    </details>

  </div>

  <hr>
  <p class="caption">Built by Brady Brown &amp; Wyatt Thompson. Follow @hogcharts on Instagram.</p>

</div>

<script src="js/common.js"></script>
<script>
// ── Data ──────────────────────────────────────────────────────────────────────
let MODEL  = null;
let TEAMS  = null;
let BYNAME = null;
let LG_DEF = null;
let SEASON = null;
let TEAM_NAMES = [];
const SELECTED = { team1: null, team2: null };

function seasonLabel(s) { return `${s-1}–${String(s).slice(2)}`; }

async function initFromData() {
  const seasons = await loadJSON("data/seasons.json").catch(() => null);
  if (seasons?.length) SEASON = seasons[0];
  else SEASON = new Date().getFullYear();

  const data = await loadJSON(`data/${SEASON}/predictor.json`);
  if (!data) {
    document.getElementById("page-sub").innerHTML =
      `<span style="color:var(--t1)">Data not found.</span>
       Run <code style="background:var(--card2);padding:2px 6px;border-radius:4px">python build_site.py</code>
       to generate <code>site/data/predictor.json</code>.`;
    return;
  }

  const { model, teams, meta } = data;
  MODEL  = model;
  TEAMS  = teams;
  BYNAME = new Map(teams.map(t => [t.team, t]));
  LG_DEF = teams.reduce((s, t) => s + t.def_eff, 0) / teams.length;

  TEAM_NAMES = teams.map(t => t.team).sort();
  const c1 = makeCombo("team1", syncVenueLabels);
  const c2 = makeCombo("team2", syncVenueLabels);
  c1.setSelected(defaultTeam("Duke Blue Devils"));
  c2.setSelected(defaultTeam("Arkansas Razorbacks"));
  syncVenueLabels();
  document.getElementById("predict-btn").disabled = false;

  const acc = meta?.backtest?.accuracy;
  const yr  = meta?.backtest_year;
  document.getElementById("page-sub").textContent = acc && yr
    ? `Predict any game — efficiency, tempo, recent form, and home court. ${(acc * 100).toFixed(1)}% accurate on the ${yr} season.`
    : "Predict any game based on efficiency, tempo, recent form, and home court.";
}

document.addEventListener("DOMContentLoaded", initFromData);

function defaultTeam(name) { return BYNAME.has(name) ? name : TEAM_NAMES[0]; }

// ── Searchable team picker ────────────────────────────────────────────────────
function makeCombo(key, onChange) {
  const input = document.getElementById(`${key}-input`);
  const list  = document.getElementById(`${key}-list`);
  const logo  = document.getElementById(`${key}-logo`);
  const clear = document.getElementById(`${key}-clear`);
  const wrap  = input.parentNode;
  let matches = [], activeIdx = -1, filter = "";

  function draw() {
    const q = filter.toLowerCase().trim();
    matches = TEAM_NAMES.filter(n => !q || n.toLowerCase().includes(q));
    if (!matches.length) { list.innerHTML = `<div class="combo-empty">No teams match.</div>`; return; }
    list.innerHTML = matches.map((n, i) => {
      const t = BYNAME.get(n);
      return `<div class="combo-opt${i === activeIdx ? " active" : ""}" data-name="${n.replace(/"/g, "&quot;")}">
        <img loading="lazy" src="${logoUrl(t.team_id)}" alt="" onerror="this.style.opacity=0">
        <span class="nm">${n}</span></div>`;
    }).join("");
  }
  function open(showAll) { filter = showAll ? "" : input.value; activeIdx = -1; draw(); list.classList.add("open"); }
  function close() { list.classList.remove("open"); activeIdx = -1; }
  function scrollActive() { const el = list.querySelector(".combo-opt.active"); if (el) el.scrollIntoView({ block: "nearest" }); }

  function setSelected(name) {
    SELECTED[key] = name;
    input.value = name || "";
    const t = name && BYNAME.get(name);
    if (t) { logo.src = logoUrl(t.team_id); logo.style.display = ""; input.classList.add("has-logo"); wrap.classList.add("filled"); }
    else   { logo.style.display = "none"; input.classList.remove("has-logo"); wrap.classList.remove("filled"); }
    input.disabled = false;
    onChange && onChange();
  }

  input.addEventListener("focus", () => { open(true); input.select(); });
  input.addEventListener("input", () => { filter = input.value; activeIdx = -1; draw(); list.classList.add("open"); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown")      { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, matches.length - 1); draw(); scrollActive(); }
    else if (e.key === "ArrowUp")   { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); draw(); scrollActive(); }
    else if (e.key === "Enter")     { e.preventDefault(); const pick = matches[activeIdx] || matches[0]; if (pick) { setSelected(pick); close(); } }
    else if (e.key === "Escape")    { input.value = SELECTED[key] || ""; close(); input.blur(); }
  });
  list.addEventListener("mousedown", e => {
    const opt = e.target.closest(".combo-opt"); if (!opt) return;
    e.preventDefault(); setSelected(opt.dataset.name); close();
  });
  // mousedown (not click) so we clear before the input's blur-revert fires
  clear.addEventListener("mousedown", e => { e.preventDefault(); input.value = ""; filter = ""; input.focus(); open(true); });
  input.addEventListener("blur", () => setTimeout(() => { input.value = SELECTED[key] || ""; close(); }, 130));

  return { setSelected };
}

// ── Venue label sync ──────────────────────────────────────────────────────────
function syncVenueLabels() {
  const n1 = SELECTED.team1, n2 = SELECTED.team2;
  document.getElementById("lbl-home1").textContent = n1 ? `${n1} home` : "Team 1 home";
  document.getElementById("lbl-home2").textContent = n2 ? `${n2} home` : "Team 2 home";
}

// ── Prediction logic (mirrors model_runtime.py predict_game) ─────────────────
function predictGame(t1, t2, venue) {
  const neutral  = venue === "neutral";
  const team1Home = venue === "home1";
  const lgAdv    = MODEL.league_home_adv;

  let homeCourt = 0;
  if (!neutral) {
    homeCourt = team1Home
      ? (t1.home_adv ?? lgAdv)
      : -(t2.home_adv ?? lgAdv);
  }

  const netDiff    = t1.net_eff  - t2.net_eff;
  const expPace    = (t1.pace    + t2.pace) / 2;
  const paceFactor = expPace / MODEL.league_avg_pace;
  const tempoAdj   = netDiff * paceFactor;
  const formDiff   = t1.form - t2.form;

  const [c0, c1, c2] = MODEL.coef;
  const spread = MODEL.intercept + c0 * tempoAdj + c1 * homeCourt + c2 * formDiff;
  const prob   = interp(spread, MODEL.iso_x, MODEL.iso_y);

  return { spread, prob, homeCourt, expPace, paceFactor, tempoAdj, formDiff,
           coef: MODEL.coef, intercept: MODEL.intercept };
}

// Mirrors pages/1_Prediction.py proj_scores()
function projScores(t1, t2, spread, expPace) {
  const pp1   = t1.off_eff + (t2.def_eff - LG_DEF);
  const pp2   = t2.off_eff + (t1.def_eff - LG_DEF);
  const total = (pp1 + pp2) / 100 * expPace;
  return { s1: Math.round((total + spread) / 2),
           s2: Math.round((total - spread) / 2) };
}

// ── Render helpers ────────────────────────────────────────────────────────────
const T1 = "var(--t1)";
const T2 = "var(--t2)";
const INK = "var(--ink)";

function heroHTML(t1, t2, r, s1, s2, sub1, sub2) {
  const w1 = Math.max(6, Math.round(r.prob * 100));
  const w2 = 100 - w1;
  const fav = r.spread >= 0 ? t1.team : t2.team;
  const favC = r.spread >= 0 ? T1 : T2;
  return `
    <div class="hc-teams">
      <div class="hc-team">
        <img src="${logoUrl(t1.team_id)}" alt="${t1.team}" onerror="this.style.opacity=0">
        <div class="hc-team-name" style="color:${T1}">${t1.team}</div>
        <div class="hc-team-sub">${sub1}</div>
      </div>
      <div style="text-align:center">
        <div class="hc-score">
          <span style="color:${T1}">${s1}</span>
          <span style="color:#42506A">&ndash;</span>
          <span style="color:${T2}">${s2}</span>
        </div>
        <div class="hc-vs" style="margin-top:6px">PROJECTED</div>
      </div>
      <div class="hc-team">
        <img src="${logoUrl(t2.team_id)}" alt="${t2.team}" onerror="this.style.opacity=0">
        <div class="hc-team-name" style="color:${T2}">${t2.team}</div>
        <div class="hc-team-sub">${sub2}</div>
      </div>
    </div>
    <div class="hc-bar">
      <div class="hc-bar-l" style="width:${w1}%;background:${T1}">${w1}%</div>
      <div class="hc-bar-r" style="width:${w2}%;background:${T2}">${w2}%</div>
    </div>
    <div class="hc-bar-labels">
      <span>${t1.team} win probability</span>
      <span>${t2.team} win probability</span>
    </div>
    <div class="hc-verdict">
      <b style="color:${favC}">${fav}</b> by
      <b>${Math.abs(r.spread).toFixed(1)}</b>
      &nbsp;·&nbsp; ${Math.round(Math.max(r.prob, 1 - r.prob) * 100)}% to win
    </div>`;
}

function rankNote(t, key) {
  const v = t[key];
  return v != null ? `#${Math.round(v)} in D-I` : "";
}

function factorHTML(label, v1, v2, higherBetter = true, note = "", signed = true) {
  const better1  = higherBetter ? v1 > v2 : v1 < v2;
  const diff     = v1 - v2;
  const edgeC    = better1 ? T1 : T2;
  const c1       = better1 ? T1 : INK;
  const c2       = !better1 ? T2 : INK;
  const display  = signed ? fmt : fmtPlain;
  const noteHTML = note ? `<div class="hc-note">${note}</div>` : "";
  const edgeSign = diff >= 0 ? "+" : "";
  return `
    <div class="hc-factor">
      <div class="v1" style="color:${c1}">${display(v1)}</div>
      <div class="mid">
        <div class="lab">${label}</div>
        <span class="hc-edge" style="background:${edgeC}22;color:${edgeC}">
          ${edgeSign}${Math.abs(diff).toFixed(1)}
        </span>
        ${noteHTML}
      </div>
      <div class="v2" style="color:${c2}">${display(v2)}</div>
    </div>`;
}

function chipsHTML(s1, s2, expPace, homeLabel, spread) {
  return `
    <div class="hc-chip"><div class="n">${s1 + s2}</div><div class="l">Proj. total</div></div>
    <div class="hc-chip"><div class="n">${expPace.toFixed(0)}</div><div class="l">Pace / poss</div></div>
    <div class="hc-chip"><div class="n">${homeLabel}</div><div class="l">Home edge</div></div>
    <div class="hc-chip"><div class="n">${Math.abs(spread).toFixed(1)}</div><div class="l">Spread</div></div>`;
}

function breakdownHTML(t1, t2, r) {
  const [c0, c1, c2] = r.coef;
  const effContrib  = c0 * r.tempoAdj;
  const homeContrib = c1 * r.homeCourt;
  const formContrib = c2 * r.formDiff;
  const rows = [
    ["Efficiency × tempo", effContrib],
    ["Home court",          homeContrib],
    ["Recent form",         formContrib],
    ["Baseline",            r.intercept],
  ];
  const rowsHTML = rows.map(([lbl, v]) => `
    <tr>
      <td>${lbl}</td>
      <td class="num">${v >= 0 ? "+" : ""}${v.toFixed(2)}</td>
    </tr>`).join("");
  return `
    <table class="breakdown-table">
      <thead><tr>
        <th>Factor</th>
        <th class="num" style="text-align:right">Points toward ${t1.team}</th>
      </tr></thead>
      <tbody>${rowsHTML}
        <tr>
          <td>Predicted margin</td>
          <td class="num">${r.spread >= 0 ? "+" : ""}${r.spread.toFixed(2)}</td>
        </tr>
      </tbody>
    </table>
    <p class="caption" style="margin-top:12px">
      Win probability is a calibrated, monotone transform of the predicted margin,
      so the spread favorite is always the win-probability favorite.
      Pace factor ${r.paceFactor.toFixed(3)} means this game projects
      ${((r.paceFactor - 1) * 100) >= 0 ? "+" : ""}${((r.paceFactor - 1) * 100).toFixed(1)}%
      vs the average tempo.
    </p>`;
}

// ── Main predict handler ──────────────────────────────────────────────────────
document.getElementById("predict-btn").addEventListener("click", () => {
  const name1  = SELECTED.team1;
  const name2  = SELECTED.team2;
  const venue  = document.querySelector('input[name="venue"]:checked').value;

  if (name1 === name2) {
    alert("Pick two different teams.");
    return;
  }

  const t1 = BYNAME.get(name1);
  const t2 = BYNAME.get(name2);
  if (!t1 || !t2) { alert("Team data not found."); return; }

  const r = predictGame(t1, t2, venue);
  const { s1, s2 } = projScores(t1, t2, r.spread, r.expPace);

  const neutral   = venue === "neutral";
  const team1Home = venue === "home1";
  const sub1 = neutral ? "Neutral floor" : (team1Home ? "Home" : "Away");
  const sub2 = neutral ? "Neutral floor" : (team1Home ? "Away" : "Home");

  const homeC  = MODEL.coef[1];
  const homePts = homeC * r.homeCourt;
  const homeLabel = neutral
    ? "Neutral floor"
    : `${Math.abs(homePts).toFixed(1)} pts · ${(team1Home ? t1 : t2).team.split(" ").pop()}`;

  document.getElementById("hero").innerHTML =
    heroHTML(t1, t2, r, s1, s2, sub1, sub2);

  document.getElementById("chips").innerHTML =
    chipsHTML(s1, s2, r.expPace, homeLabel, r.spread);

  document.getElementById("factors").innerHTML = [
    factorHTML("Net rating",        t1.net_eff, t2.net_eff, true,
      `${rankNote(t1,"rank")} vs ${rankNote(t2,"rank")}`, true),
    factorHTML("Offense (pts/100)", t1.off_eff, t2.off_eff, true,
      `${rankNote(t1,"off_rank")} vs ${rankNote(t2,"off_rank")}`, false),
    factorHTML("Defense (pts/100)", t1.def_eff, t2.def_eff, false,
      `${rankNote(t1,"def_rank")} vs ${rankNote(t2,"def_rank")} · lower is better`, false),
    factorHTML("Recent form (L5)",  t1.form, t2.form, true,
      "opponent-adjusted margin over last 5 games", true),
  ].join("");

  document.getElementById("breakdown").innerHTML = breakdownHTML(t1, t2, r);

  document.getElementById("results").style.display = "";
  document.getElementById("results").scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>
</body>
</html>
