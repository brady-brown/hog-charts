<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player | Hog Charts</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <meta name="theme-color" content="#0E1320">
  <link rel="apple-touch-icon" href="img/logo.png">
  <style>
    .pp-bar { display:flex; justify-content:flex-end; max-width:900px; margin:6px auto 14px; }
    .pp-bar .form-group { margin:0; width:180px; flex:0 0 auto; }
    .pp-status { color:var(--muted); font-size:.92rem; max-width:900px; margin:0 auto; padding:24px 0; }
    .pp-status:empty { display:none; }
    #pp-slot { max-width:900px; margin:0 auto; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="img/logo.png" alt="Hog Charts logo">Hog Charts</a>
</nav>

<div class="container">
  <div class="pp-bar">
    <div class="form-group narrow"><label for="pp-season">Season</label><select id="pp-season"></select></div>
  </div>
  <div class="pp-status" id="pp-status">Loading…</div>
  <div id="pp-slot"></div>
</div>

<script src="js/common.js"></script>
<script src="js/court.js"></script>
<script src="js/zone-chart.js"></script>
<script src="js/games.js"></script>
<script src="js/player-card.js"></script>
<script>
// Player page: the player card rendered as a page (PlayerCard inline mode), with
// a season picker and the state in the URL (?id=&season=&tab=) so it can be shared.
// Seasons come from his career shard; each season's row from that season's
// player-stats-all.json, falling back to the unfiltered career file for a season
// the stats table leaves out.
const CAREER_SHARDS = 64;   // MUST match hoglib/careers.py
const params = new URLSearchParams(location.search);
const PLAYER_ID = Number(params.get("id"));
let CUR_SEASON = null, SEASON = null, TAB = params.get("tab") || "season", IDENTITY = null;

function syncUrl() {
  history.replaceState(null, "", `?id=${PLAYER_ID}&season=${SEASON}&tab=${TAB}`);
}

async function seasonRow(season) {
  const stats = await loadJSON(`data/${season}/player-stats-all.json`);
  const row = stats?.players?.find(p => p.id === PLAYER_ID);
  if (row) return row;
  const career = await loadJSON(`data/${season}/player-stats-career.json`);
  const careerRow = career?.players?.find(p => p.id === PLAYER_ID);
  // The career file carries stats only, so name/position/bio come from another season.
  return careerRow && IDENTITY ? { ...IDENTITY, ...careerRow, n: IDENTITY.n } : null;
}

async function show(season) {
  SEASON = season;
  const status = document.getElementById("pp-status");
  status.textContent = "Loading…";
  const row = await seasonRow(season);
  if (!row) { status.textContent = "No stats for this player in that season."; return; }
  status.textContent = "";
  document.title = `${row.n} | Hog Charts`;
  await PlayerCard.open(row, {
    season, curSeason: CUR_SEASON, hasOnOff: row.on_off != null,
    inline: document.getElementById("pp-slot"), tab: TAB,
    onTab: tab => { TAB = tab; syncUrl(); },
  });
  syncUrl();
}

async function init() {
  const status = document.getElementById("pp-status");
  if (!PLAYER_ID) { status.textContent = "No player selected."; return; }
  const seasons = await loadJSON("data/seasons.json") ?? [];
  CUR_SEASON = seasons[0];
  const shard = await loadJSON(`data/careers/${PLAYER_ID % CAREER_SHARDS}.json`);
  const careerSeasons = [...new Set((shard?.[String(PLAYER_ID)] ?? []).map(r => r.s))].sort((a, b) => b - a);
  if (!careerSeasons.length) { status.textContent = "Player not found."; return; }

  // Identity (name, position, height…) from his most recent season in the stats table.
  for (const s of careerSeasons) {
    const stats = await loadJSON(`data/${s}/player-stats-all.json`);
    IDENTITY = stats?.players?.find(p => p.id === PLAYER_ID);
    if (IDENTITY) break;
  }
  // Never in the table (a few minutes a season): his team's game file still names him.
  if (!IDENTITY) {
    const latest = shard[String(PLAYER_ID)].reduce((a, b) => (b.s > a.s ? b : a));
    const file = await Games.teamFile(latest.s, latest.tid);
    const line = file?.games.flatMap(g => g.players).find(p => p.id === PLAYER_ID);
    const positions = { G: "Guard", F: "Forward", C: "Center" };   // box scores abbreviate
    if (line) IDENTITY = { id: PLAYER_ID, n: line.n, pos: positions[line.pos] ?? line.pos };
  }

  const sSel = document.getElementById("pp-season");
  sSel.innerHTML = careerSeasons.map(s => `<option value="${s}">${seasonLabel(s)}</option>`).join("");
  const wanted = Number(params.get("season"));
  sSel.value = careerSeasons.includes(wanted) ? wanted : careerSeasons[0];
  sSel.addEventListener("change", () => show(Number(sSel.value)));
  show(Number(sSel.value));
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
