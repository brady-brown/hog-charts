<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shot Charts | Hog Charts</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <meta name="theme-color" content="#0E1320">
  <link rel="apple-touch-icon" href="img/logo.png">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    /* ── tabs ───────────────────────────────────────────────────────────── */
    .tab-bar {
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .tab-bar button {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      color: var(--muted); padding: 10px 18px;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .12s;
    }
    .tab-bar button:hover { color: var(--ink); }
    .tab-bar button.active { color: var(--ink); border-bottom-color: var(--t1); }

    /* ── sub-tab (smaller) ───────────────────────────────────────────────── */
    .sub-tab-bar {
      display: flex; gap: 0;
      background: var(--card2); border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
      width: fit-content; margin-bottom: 16px;
    }
    .sub-tab-bar button {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 0.85rem; font-weight: 600;
      color: var(--muted); padding: 8px 20px;
      transition: background .12s, color .12s;
    }
    .sub-tab-bar button.active { background: var(--t1); color: #fff; }

    /* ── selectors row ───────────────────────────────────────────────────── */
    .sel-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    .sel-row .form-group { flex: 1; min-width: 200px; }

    /* ── charts ──────────────────────────────────────────────────────────── */
    .chart-wrap { border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
    .chart-placeholder {
      height: 480px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 14px;
      color: var(--muted); font-size: 0.95rem; margin-bottom: 16px;
    }

    /* ── section visibility ──────────────────────────────────────────────── */
    .section { display: none; }
    .section.active { display: block; }
    /* zone-chart styles now live in css/style.css (shared with modals) */
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand"><img src="img/logo.png" alt="Hog Charts logo">Hog Charts</a>
</nav>

<div class="container">

  <h2>Shot Charts</h2>
  <p class="page-sub">Zone efficiency, shot density, and scatter for any team or player — 2026 season.</p>

  <!-- ── primary tabs ─────────────────────────────────────────────────────── -->
  <div class="tab-bar">
    <button id="tab-team"   class="active" onclick="setPrimaryTab('team')">Team</button>
    <button id="tab-player" onclick="setPrimaryTab('player')">Player</button>
  </div>

  <!-- ════════════════════ TEAM SECTION ════════════════════ -->
  <div id="sec-team" class="section active">

    <div class="sel-row">
      <div class="form-group">
        <label for="t-team-sel">Team</label>
        <select id="t-team-sel" disabled><option>Loading…</option></select>
      </div>
      <div class="form-group" style="flex:0 0 130px;min-width:0">
        <label for="min-gp">Min games played</label>
        <input type="number" id="min-gp" value="10" min="1" max="40" step="1">
      </div>
    </div>

    <div class="sub-tab-bar">
      <button id="t-stab-season" class="active" onclick="setSubTab('team','season')">Season</button>
      <button id="t-stab-game"   onclick="setSubTab('team','game')">In a Game</button>
    </div>

    <!-- team game selector (hidden unless In a Game) -->
    <div class="sel-row" id="t-game-row" style="display:none">
      <div class="form-group">
        <label for="t-game-sel">Game</label>
        <select id="t-game-sel"></select>
      </div>
    </div>

    <button class="btn" id="t-gen-btn" disabled style="margin-bottom:18px">Generate Chart</button>

    <div id="t-zone-wrap"    class="chart-wrap"><div class="chart-placeholder">Select a team and click Generate Chart.</div></div>
    <div id="t-density-wrap" class="chart-wrap" style="display:none"><div class="chart-placeholder" id="t-density-ph"></div></div>
    <div id="t-scatter-wrap" class="chart-wrap" style="display:none"><div class="chart-placeholder" id="t-scatter-ph"></div></div>

  </div><!-- /sec-team -->

  <!-- ════════════════════ PLAYER SECTION ════════════════════ -->
  <div id="sec-player" class="section">

    <div class="sel-row">
      <div class="form-group">
        <label for="p-team-sel">Team</label>
        <select id="p-team-sel" disabled><option>Loading…</option></select>
      </div>
      <div class="form-group">
        <label for="p-player-sel">Player</label>
        <select id="p-player-sel" disabled><option>— select player —</option></select>
      </div>
    </div>

    <div class="sub-tab-bar">
      <button id="p-stab-season" class="active" onclick="setSubTab('player','season')">Season</button>
      <button id="p-stab-game"   onclick="setSubTab('player','game')">In a Game</button>
    </div>

    <!-- player game selector (hidden unless In a Game) -->
    <div class="sel-row" id="p-game-row" style="display:none">
      <div class="form-group">
        <label for="p-game-sel">Game</label>
        <select id="p-game-sel"></select>
      </div>
    </div>

    <button class="btn" id="p-gen-btn" disabled style="margin-bottom:18px">Generate Chart</button>

    <div id="p-zone-wrap"    class="chart-wrap"><div class="chart-placeholder">Select a team and player, then click Generate Chart.</div></div>
    <div id="p-density-wrap" class="chart-wrap" style="display:none"></div>
    <div id="p-scatter-wrap" class="chart-wrap" style="display:none"></div>

  </div><!-- /sec-player -->

  <hr>
  <p class="caption">Built by Brady Brown &amp; Wyatt Thompson. Follow @hogcharts on Instagram.</p>

</div><!-- /container -->

<script src="js/common.js"></script>
<script src="js/court.js"></script>
<script src="js/zone-chart.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Court geometry  (scatter / density — college 3PT)
// ═══════════════════════════════════════════════════════════════════════════
// Court geometry (X_RANGE/Y_RANGE, courtTraces, shotsXY, densityTraces) comes
// from js/court.js, loaded before this script.
const MAKE_C   = "#22C55E";
const MISS_C   = "#EF4444";

const THREE_ZONE_SET = new Set([
  "3PT - Right","3PT - Right Center","3PT - Center","3PT - Left Center","3PT - Left"
]);

const BASE_LAYOUT = {
  paper_bgcolor:"#0B0E14", plot_bgcolor:"#0B0E14",
  height:480, margin:{l:10,r:10,t:68,b:10},
  showlegend:false, dragmode:false,
  xaxis:{range:X_RANGE, visible:false, scaleanchor:"y", scaleratio:1, constrain:"domain"},
  yaxis:{range:Y_RANGE, visible:false, constrain:"domain"},
};
const CFG = {displaylogo:false, scrollZoom:false, responsive:true, displayModeBar:false};

function titleLayout(title, sub) {
  return {
    text: `<b>${title}</b><br><span style="font-size:12px;color:#9AA4B2">${sub}</span>`,
    x:0.5, xanchor:"center", y:0.97,
    font:{color:"#E6E9EF", size:17},
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// Data layer
// ═══════════════════════════════════════════════════════════════════════════
let SD             = null;   // shots-meta (zones, zone_baselines, team_zones, …)
let SHOT_CACHE     = {};
let ZONES          = [];
let ZONE_BASELINES = null;
let SEASON         = "2026";

async function fetchTeamShots(teamName) {
  if (SHOT_CACHE[teamName]) return SHOT_CACHE[teamName];
  const slug = SD?.team_zones?.[teamName]?.slug;
  if (!slug) return null;
  const data = await loadJSON(`data/shots/${slug}.json`);
  if (data) SHOT_CACHE[teamName] = data;
  return data;
}

function computeZoneStats(shots, filterFn) {
  return ZoneChart.computeZones(shots, filterFn);
}

function splitSubtitle(base, zoneData) {
  let tm=0, ta=0, t3m=0, t3a=0;
  for (const [zi, m, a] of zoneData) {
    tm+=m; ta+=a;
    if (THREE_ZONE_SET.has(ZONES[zi])) { t3m+=m; t3a+=a; }
  }
  const t2m=tm-t3m, t2a=ta-t3a;
  const p=(m,a)=>a>0?`${(m/a*100).toFixed(0)}%`:"—";
  return `${base}  ·  FG ${tm}/${ta} (${p(tm,ta)})  ·  2PT ${p(t2m,t2a)}  ·  3PT ${p(t3m,t3a)}`;
}

// ═══════════════════════════════════════════════════════════════════════════
// Renderers
// ═══════════════════════════════════════════════════════════════════════════
function renderZone(container, zoneData, title, subtitle) {
  ZoneChart.render(container, zoneData,
    {zones: ZONES, baselines: ZONE_BASELINES, title, subtitle, minAtt: 5});
}

function renderDensity(divId, mx, my, hx, hy, title, subtitle) {
  const traces = densityTraces(mx, my, hx, hy);
  const total = mx.length + hx.length;
  const makes = mx.length;
  const pct   = total>0 ? (makes/total*100).toFixed(0)+"%" : "—";
  const densityLayout = {
    ...BASE_LAYOUT,
    paper_bgcolor:"#0B0E14",
    plot_bgcolor:"#F0E8D5",
    title:titleLayout(title, `${subtitle}  ·  ${makes}/${total} FG (${pct})`),
  };
  Plotly.react(divId, traces, densityLayout, CFG);
}

function renderScatter(divId, mx, my, hx, hy, title, subtitle) {
  const traces = [
    ...courtTraces(),
    {
      type:"scatter", x:hx, y:hy, mode:"markers",
      name:`Miss (${hx.length})`,
      marker:{color:MISS_C, size:8, symbol:"x",
              line:{color:"white",width:0.6}, opacity:0.82},
      hoverinfo:"skip",
    },
    {
      type:"scatter", x:mx, y:my, mode:"markers",
      name:`Make (${mx.length})`,
      marker:{color:MAKE_C, size:8, symbol:"circle",
              line:{color:"white",width:0.6}, opacity:0.85},
      hoverinfo:"skip",
    },
  ];
  Plotly.react(divId, traces,
    {...BASE_LAYOUT, showlegend:true,
     legend:{orientation:"h",x:0.5,xanchor:"center",y:0.02,
             bgcolor:"rgba(17,21,31,0.7)",font:{color:"#E6E9EF"}},
     title:titleLayout(title, subtitle)}, CFG);
}

// ═══════════════════════════════════════════════════════════════════════════
// Chart container helpers
//   • zone chart renders inline SVG → ZoneChart writes into the raw wrap element
//   • density / scatter render Plotly → they need a dedicated child div id
// ═══════════════════════════════════════════════════════════════════════════
function ensureZoneEl(wrapId) {
  const wrap = document.getElementById(wrapId);
  wrap.style.display = "";
  return wrap;
}

function ensureDiv(wrapId, divId) {
  const wrap = document.getElementById(wrapId);
  let div = document.getElementById(divId);
  if (!div) {
    div = document.createElement("div");
    div.id = divId;
    wrap.innerHTML = "";
    wrap.appendChild(div);
  }
  wrap.style.display = "";
  return divId;
}

// ═══════════════════════════════════════════════════════════════════════════
// TEAM tab logic
// ═══════════════════════════════════════════════════════════════════════════
let tSubTab = "season";

async function tGenerate() {
  const teamName = document.getElementById("t-team-sel").value;
  const td = await fetchTeamShots(teamName);
  if (!td) { alert("No shot data for " + teamName); return; }

  if (tSubTab === "season") {
    // Compute zones from raw shots (14-zone scheme) so it matches the player
    // cards and the per-game view, rather than stale precomputed data.
    const zoneData = computeZoneStats(td.shots, () => true);
    const sub      = splitSubtitle(`${teamName} · ${SEASON} season`, zoneData);
    renderZone(ensureZoneEl("t-zone-wrap"), zoneData, teamName, sub);
    const {mx,my,hx,hy} = shotsXY(td.shots, () => true);
    renderDensity(ensureDiv("t-density-wrap","t-density"), mx,my,hx,hy,
      teamName, `${SEASON} season · shot density`);
    document.getElementById("t-scatter-wrap").style.display = "none";
  } else {
    const gi   = parseInt(document.getElementById("t-game-sel").value);
    const game = td.games[gi];
    if (!game) { alert("Select a game."); return; }
    const filterFn = (g, _p) => g === gi;
    const zoneData = computeZoneStats(td.shots, filterFn);
    const gameSub  = `${game.date} · vs ${game.opp}`;
    renderZone(ensureZoneEl("t-zone-wrap"), zoneData, teamName,
      splitSubtitle(`${teamName} · ${gameSub}`, zoneData));
    const {mx,my,hx,hy} = shotsXY(td.shots, filterFn);
    renderScatter(ensureDiv("t-scatter-wrap","t-scatter"), mx,my,hx,hy, teamName, gameSub);
    document.getElementById("t-density-wrap").style.display = "none";
  }
}

async function tOnTeamChange() {
  const teamName = document.getElementById("t-team-sel").value;
  const gSel = document.getElementById("t-game-sel");
  gSel.innerHTML = "<option>Loading…</option>";
  const td = await fetchTeamShots(teamName);
  gSel.innerHTML = td?.games?.map((g,i) =>
    `<option value="${i}">${g.label}</option>`).join("") ?? "<option>No games</option>";
}

// ═══════════════════════════════════════════════════════════════════════════
// PLAYER tab logic
// ═══════════════════════════════════════════════════════════════════════════
let pSubTab = "season";

async function pGenerate() {
  const teamName   = document.getElementById("p-team-sel").value;
  const playerName = document.getElementById("p-player-sel").value;
  if (!playerName) { alert("Select a player."); return; }
  const td = await fetchTeamShots(teamName);
  if (!td) { alert("No shot data for " + teamName); return; }
  const pi = td.players.indexOf(playerName);

  if (pSubTab === "season") {
    const filterFn = (_g, p) => p === pi;
    const zoneData = computeZoneStats(td.shots, filterFn);
    renderZone(ensureZoneEl("p-zone-wrap"), zoneData, playerName,
      splitSubtitle(`${teamName} · ${SEASON} season`, zoneData));
    const {mx,my,hx,hy} = shotsXY(td.shots, filterFn);
    renderDensity(ensureDiv("p-density-wrap","p-density"), mx,my,hx,hy,
      playerName, `${SEASON} season · shot density`);
    document.getElementById("p-scatter-wrap").style.display = "none";
  } else {
    const gi   = parseInt(document.getElementById("p-game-sel").value);
    const game = td.games[gi];
    if (!game) { alert("Select a game."); return; }
    const filterFn = (g, p) => g === gi && p === pi;
    const zoneData = computeZoneStats(td.shots, filterFn);
    const gameSub  = `${game.date} · vs ${game.opp}`;
    renderZone(ensureZoneEl("p-zone-wrap"), zoneData, playerName,
      splitSubtitle(`${playerName} · ${gameSub}`, zoneData));
    const {mx,my,hx,hy} = shotsXY(td.shots, filterFn);
    renderScatter(ensureDiv("p-scatter-wrap","p-scatter"), mx,my,hx,hy, playerName, gameSub);
    document.getElementById("p-density-wrap").style.display = "none";
  }
}

async function pOnTeamChange() {
  const teamName = document.getElementById("p-team-sel").value;
  const pSel = document.getElementById("p-player-sel");
  pSel.innerHTML = "<option>Loading…</option>";
  pSel.disabled  = true;
  const td = await fetchTeamShots(teamName);
  const players = td?.players ?? [];
  pSel.innerHTML = players.length
    ? players.map(n => `<option value="${n}">${n}</option>`).join("")
    : "<option value=''>No player data</option>";
  pSel.disabled = players.length === 0;
  pOnPlayerChange(td);
}

function pOnPlayerChange(td) {
  const teamName   = document.getElementById("p-team-sel").value;
  const playerName = document.getElementById("p-player-sel").value;
  td = td ?? SHOT_CACHE[teamName];
  if (!td || !playerName) return;
  const pi    = td.players.indexOf(playerName);
  const giSet = new Set();
  for (let i = 0; i < td.shots.length; i += 5) {
    if (td.shots[i+4] === pi && td.shots[i] >= 0) giSet.add(td.shots[i]);
  }
  const gSel = document.getElementById("p-game-sel");
  gSel.innerHTML = [...giSet].sort((a,b)=>a-b).map(gi => {
    const g = td.games[gi];
    return g ? `<option value="${gi}">${g.label}</option>` : "";
  }).join("");
}

// ═══════════════════════════════════════════════════════════════════════════
// Tab switching
// ═══════════════════════════════════════════════════════════════════════════
function setPrimaryTab(tab) {
  document.getElementById("sec-team").classList.toggle("active",   tab==="team");
  document.getElementById("sec-player").classList.toggle("active", tab==="player");
  document.getElementById("tab-team").classList.toggle("active",   tab==="team");
  document.getElementById("tab-player").classList.toggle("active", tab==="player");
}

function setSubTab(side, tab) {
  const isTeam = side === "team";
  if (isTeam) tSubTab = tab; else pSubTab = tab;

  const activeBtn = document.getElementById(`${side[0]}-stab-${tab}`);
  const otherBtn  = document.getElementById(`${side[0]}-stab-${tab==="season"?"game":"season"}`);
  activeBtn.classList.add("active");
  otherBtn.classList.remove("active");

  const gameRow = document.getElementById(`${side[0]}-game-row`);
  gameRow.style.display = tab === "game" ? "" : "none";
}

// ═══════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════
async function init() {
  SD = await loadJSON("data/shots-meta.json");
  if (!SD?.team_zones) {
    document.querySelectorAll(".chart-placeholder").forEach(el =>
      el.textContent = "Shot data not found — run build_site.py first."
    );
    return;
  }

  // Zone names + NCAA baselines come from zone-baselines.json (the current
  // 14-zone scheme), the same source the player-card charts use. shots-meta's
  // own zone fields can be stale, so we don't rely on them here.
  const zoneBaselineData = await loadJSON("data/zone-baselines.json");
  ZONES          = zoneBaselineData?.zones || SD.zones;
  ZONE_BASELINES = zoneBaselineData?.baselines || null;
  SEASON         = SD.meta?.season ?? "2026";

  function populateTeamSelectors() {
    const minG = parseInt(document.getElementById("min-gp").value) || 0;
    const filtered = Object.keys(SD.team_zones)
      .filter(n => (SD.team_zones[n].gp ?? 0) >= minG)
      .sort();
    const opts = filtered.map(n => `<option value="${n}">${n}</option>`).join("");
    ["t-team-sel", "p-team-sel"].forEach(id => {
      const el  = document.getElementById(id);
      const cur = el.value;
      el.innerHTML = opts;
      if (filtered.includes(cur)) {
        el.value = cur;
      } else {
        el.value = filtered.find(n => n.includes("Arkansas")) || filtered[0] || "";
      }
    });
  }

  populateTeamSelectors();

  ["t-team-sel", "p-team-sel"].forEach(id =>
    document.getElementById(id).disabled = false
  );

  document.getElementById("min-gp").addEventListener("input", populateTeamSelectors);
  document.getElementById("t-team-sel").addEventListener("change", tOnTeamChange);
  document.getElementById("p-team-sel").addEventListener("change", pOnTeamChange);
  document.getElementById("p-player-sel").addEventListener("change", () => pOnPlayerChange());

  document.getElementById("t-gen-btn").disabled = false;
  document.getElementById("p-gen-btn").disabled = false;
  document.getElementById("t-gen-btn").addEventListener("click", () => tGenerate());
  document.getElementById("p-gen-btn").addEventListener("click", () => pGenerate());

  tOnTeamChange();
  pOnTeamChange();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
